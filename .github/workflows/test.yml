name: tests

on:
  push:
  pull_request:

jobs:
  cmake-test-all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make

      - name: Run tests
        run: |
          mkdir build
          cd build
          cmake ..
          make test-all
