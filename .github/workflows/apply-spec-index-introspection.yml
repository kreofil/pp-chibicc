name: Apply specialization index introspection

on:
  push:
    branches:
      - feature/spec-index-introspection
    paths:
      - .github/workflows/apply-spec-index-introspection.yml
      - .github/scripts/apply_spec_index_introspection.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spec-index-introspection

      - name: Apply implementation and tests
        run: python3 .github/scripts/apply_spec_index_introspection.py

      - name: Run full test suite
        run: make test-all

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c test/ppc-spec-index.c test/driver.sh docs/ppc-manual-ru.md
          git commit -m "Add specialization index introspection helpers"
          git push origin HEAD:feature/spec-index-introspection
