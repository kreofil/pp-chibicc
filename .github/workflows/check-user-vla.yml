name: Check uploaded PPC VLA example

on:
  push:
    branches:
      - fix/ppc-vla-tags
    paths:
      - test/tmp-user-vla-repro.c
      - .github/workflows/check-user-vla.yml

jobs:
  check-user-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ppc-vla-tags

      - name: Build compiler and uploaded example
        run: |
          set -euxo pipefail
          make chibicc
          ./chibicc -Iinclude -Itest -c -o /tmp/user-vla.o test/tmp-user-vla-repro.c
          cc -pthread -o /tmp/user-vla.exe /tmp/user-vla.o

      - name: Run and verify uploaded example twenty times
        run: |
          set -euxo pipefail
          for run in $(seq 1 20); do
            /tmp/user-vla.exe > /tmp/out.$run

            awk '/-- 1st step --/{flag=1;next}/-- 2nd step --/{flag=0}flag' /tmp/out.$run > /tmp/first.$run
            test "$(grep -c 'Unknown Week Day' /tmp/first.$run)" -eq 10
            ! grep -q 'It is ' /tmp/first.$run
            for i in $(seq 0 9); do
              grep -Fx "$i. Unknown Week Day {$i}" /tmp/first.$run
            done

            awk '/-- 4th step --/{flag=1;next}flag' /tmp/out.$run > /tmp/fourth.$run
            test "$(grep -c 'Unknown Week Day' /tmp/fourth.$run)" -eq 10
            ! grep -q 'It is ' /tmp/fourth.$run
          done
          cat /tmp/out.1
