name: implement runtime specialization counts

on:
  push:
    branches:
      - feature/runtime-spec-count

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-spec-count

      - name: Apply runtime count implementation
        run: python3 tools/apply-runtime-spec-count.py

      - name: Run full test suite
        run: make test-all

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c test/ppc.c test/ppc-spec-count.c docs/ppc-manual-ru.md
          git rm .github/workflows/runtime-spec-count-impl.yml tools/apply-runtime-spec-count.py
          git commit -m "Allow runtime counts in PPC specialization helpers"
          git push origin HEAD:feature/runtime-spec-count
