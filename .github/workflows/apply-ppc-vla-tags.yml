name: Apply PPC VLA tag initialization

on:
  push:
    branches:
      - fix/ppc-vla-tags
    paths:
      - .github/workflows/apply-ppc-vla-tags.yml
      - .github/scripts/apply_ppc_vla_tags.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ppc-vla-tags

      - name: Apply implementation and regression test
        run: python3 .github/scripts/apply_ppc_vla_tags.py

      - name: Run focused PPC VLA test
        run: make test/ppc-vla.exe && test/ppc-vla.exe

      - name: Run full test suite
        run: make test-all

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c test/ppc-vla.c
          git commit -m "Initialize PPC tags in variable length arrays"
          git push origin HEAD:fix/ppc-vla-tags
